<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acceso al panel de control del sistema de reportes RIETI."
    />
    <title>Iniciar sesión | RIETI</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page" data-session-checking>
    <main class="login-layout">
      <section class="login-brand" aria-label="RIETI, sistema de reportes">
        <div class="login-brand__content">
          <img class="login-brand__image" src="assets/logo-rieti-completo.png" width="500" height="500" alt="RIETI: Ruta Intermunicipal para la Erradicación del Trabajo Infantil" fetchpriority="high" />
        </div>
      </section>

      <!-- PANEL DE AUTENTICACIÓN -->
      <section class="login-panel" aria-labelledby="login-title">
        <p class="login-session-status" role="status">Comprobando sesión…</p>
        <noscript>Activa JavaScript para iniciar sesión.</noscript>
        <form class="login-form" aria-busy="true">
          <div class="login-form__heading">
            <p class="eyebrow">Panel de control</p>
            <h1 id="login-title">Iniciar sesión</h1>
            <p>Ingresa tus datos para acceder al dashboard.</p>
          </div>

          <div class="form-field">
            <label for="role">Tipo de cuenta</label>
            <select id="role" name="role" required>
              <option value="administrador">Administrador</option>
              <option value="procurador">Procurador</option>
            </select>
          </div>
          <div class="form-field">
            <label for="email">Correo electrónico o nombre</label>
            <input
              id="email"
              name="email"
              type="text"
              autocomplete="username"
              placeholder="nombre@institucion.gob.mx"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Contraseña</label>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Ingresa tu contraseña"
                required
              />
              <!--
                CONTROL DE VISIBILIDAD:
                app.js cambia el tipo del campo entre password y text. El estado
                accesible también se actualiza para lectores de pantalla.
              -->
              <button
                class="password-toggle"
                type="button"
                aria-label="Mostrar contraseña"
                aria-controls="password"
                aria-pressed="false"
                data-action="toggle-password"
              >
                <svg data-icon="show-password" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                  <circle cx="12" cy="12" r="2.7" />
                </svg>
                <svg data-icon="hide-password" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path d="M3.2 8.1C1.8 10 1.2 12 1.2 12s3.8 6 10.8 6c1.6 0 3-.3 4.2-.8M8.4 6.6A10.7 10.7 0 0 1 12 6c7 0 10.8 6 10.8 6s-.7 1.2-2 2.5M9.8 9.8A3.1 3.1 0 0 0 14.2 14.2M3 3l18 18" />
                </svg>
              </button>
            </div>
          </div>

          <div class="login-form__options">
            <label class="checkbox-control" for="remember">
              <input id="remember" name="remember" type="checkbox" />
              <span>Recordar sesión</span>
            </label>

          </div>

          <!-- Express valida las credenciales y crea una sesión HttpOnly. -->
            <button class="primary-button" type="submit" id="btn-login">
              Iniciar sesión
            </button>
            <p id="mensaje-error" role="alert" hidden></p>

          <p class="login-form__support">
            ¿Problemas para ingresar? Contacta al administrador del sistema.
          </p>
          <p class="login-about" data-public-registration hidden><a href="pages/registro.html">Crear cuenta de administrador</a></p>
          <p class="login-about"><a href="pages/acerca.html">Acerca de RIETI</a></p>
        </form>
      </section>
    </main>

    <!-- Login y sesión contra el backend del proyecto. -->
    <script src="js/api.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/login.js" defer></script>
  </body>
</html>
